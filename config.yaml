# ============================================================
# 星地协同算力路由仿真配置 (v5)
# 对应《项目总体设计文档.md》§12。星座始终全量构建(不缩比)。
# ============================================================

simulation:
  scenario: 1            # 1: 500 LEO | 2: 500 LEO+EDGE+DC | 3: 2x500 LEO+6 GEO
  strategy: latency      # latency | balance | energy  (每次只用一个)
  solver: S1             # S0 | S1 | S2 | S3 | S4 | S5
  t_start_sec: 0
  t_end_sec: 3600        # 60 min
  slot_sec: 30
  random_seed: 42
  log_level: INFO

# ===================== 星座(多壳层 Walker) =====================
# Walker i:T/P/F。pattern=delta:RAAN 在 360° 均布(倾斜轨道);star:RAAN 在 180° 均布(近极轨道,
# 若用 delta 则升/降轨面两两重合)。
constellation:
  shells:
    - {name: L1, planes: 20, per_plane: 25, alt_km: 550,  inc_deg: 53, phase: 1, pattern: delta}  # 53°:500/20/1
    - {name: L2, planes: 20, per_plane: 25, alt_km: 1100, inc_deg: 87, phase: 1, pattern: star}   # 87°:500/20/1
  geo:
    count: 6
    longitudes_deg: [0, 60, 120, 180, -120, -60]
  # 每场景启用哪些壳层 + 是否启用 GEO / 地面算力
  scenario_shells:
    1: [L1]
    2: [L1]
    3: [L1, L2]
  scenario_geo:    {1: false, 2: false, 3: true}
  scenario_ground: {1: none, 2: compute_only, 3: none}
  scenario_max_concurrency: {1: 200, 2: 250, 3: 500}   # 标定到达量用的参考并发
  enforce_max_concurrency: false   # false:超过上限也正常服务;true:达到上限拒绝新任务
  allow_cross_shell_isl: true

