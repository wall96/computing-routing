# ===================== 节点等效AI处理算力(TFLOPS,内部转等效 op/s) =====================
# 统一按低精度 Tensor 等效吞吐标定，不与 FP32/FP64 峰值混用。
# LEO≈单个低功耗AI模块；GEO≈多模块；EDGE≈4卡推理服务器；DC≈单台8卡AI服务器。
# 与下面 η、功率上限联合标定：Pmax = η × Cmax。
compute_capacity_tflops:
  LEO:    400       # 用户区间300~500的中值
  GEO:    1350      # 用户区间1200~1500的中值
  EDGE:   6000      # 约4×1466 Tensor TFLOPS
  DC:     32000     # 约1台DGX H100的32 PFLOPS FP8
  ACCESS: 0

# 每等效操作能耗 η_v (J/op)；由目标功率/等效吞吐反推。
energy_compute_eta_J_per_cycle:
  LEO:    3.75e-13                 # 150 W / 400e12 op/s
  GEO:    3.703703703703704e-13    # 500 W / 1350e12 op/s
  EDGE:   2.3333333333333334e-13   # 1400 W / 6000e12 op/s
  DC:     3.1875e-13               # 10.2 kW / 32000e12 op/s
  ACCESS: 0.0

# 计算功率预算 P_v^max (W)；与容量、η严格对应。
compute_power_budget_W:
  LEO:    150
  GEO:    500
  EDGE:   1400
  DC:     10200
  ACCESS: 0.0

# ===================== 链路每比特能耗 β_e (J/bit) =====================
energy_link_beta_J_per_bit:
  TER:          1.5e-10
  ISL_LEO_LEO:  3.5e-9
  ISL_LEO_GEO:  4.0e-8
  SGL_LEO:      5.0e-8
  SGL_GEO:      1.2e-7

# ===================== 链路参数(标称) =====================
link_params:
  isl_leo_leo: {bw_mbps: 10000, loss_rate: 1.0e-6, jitter_ms: 0.1}
  isl_leo_geo: {bw_mbps: 2000,  loss_rate: 1.0e-5, jitter_ms: 0.5}
  sgl_leo:     {bw_mbps: 1000,  loss_rate: 1.0e-5, jitter_ms: 1.0, min_elevation_deg: 25}
  sgl_geo:     {bw_mbps: 1000,  loss_rate: 1.0e-5, jitter_ms: 1.0, min_elevation_deg: 5}
  ter:         {bw_mbps: 100000,loss_rate: 1.0e-7, jitter_ms: 0.05}

# ===================== 时变信道(C3) =====================
channel:
  time_varying: true
  sgl_rate_floor: 0.4    # 低仰角速率下限系数
  isl_rate_floor: 0.7    # 远距离 ISL 速率下限系数

# ===================== 业务(A1/A2/A3) =====================
traffic:
  truncate_at_simulation_end: true  # 生成时收短尾部会话，arrival+duration不超过simulation.t_end_sec
  endpoint_mode: satellite      # 所有业务均在卫星产生，源和目的均为当前场景中的卫星
  endpoint_types_by_biz:        # 场景3中GEO不能作为LL源或目的
    LL: [LEO]
    HR: [LEO, GEO]
    HC: [LEO, GEO]
    MC: [LEO, GEO]
  arrival_at_slot_start: true   # 片首统一进入；片内拓扑和路由保持不变
  arrival_rate_per_slot: {LL: 3, HR: 2, HC: 3, MC: 1}   # LL/HR 多、HC/MC 少
  peak_profile:          # 高峰包络:片区间 → 到达率倍乘(无昼夜);标定到峰值≈500 并发
    - {from: 0,   to: 18,   mult: 1.0}
    - {from: 18,  to: 42,   mult: 2.6}
    - {from: 42,  to: 1000, mult: 0.6}
  qos:
    # 基础计算量 + 多目的附加计算量；固定开销按处理块/帧计。
    # satellite模式下，dst_knn表示当前快照中按最短传播时延排序的最近N颗可达卫星。
    LL: {priority: 1, mode: burst,   delay_ms: 20,  loss: 0.01,   rate_mbps: [2, 10],    duration_s: [60, 300],   compression_rho: 0.10, processing_logic: low_latency_filter,              cycles_per_bit_base: 50,   cycles_per_bit_per_dst: 0,  fixed_processing_ms: 0.05, fixed_processing_ms_per_dst: 0,    Lref_bits: 12000,   dst_knn: 5}
    HR: {priority: 2, mode: burst,   delay_ms: 200, loss: 2.0e-4, rate_kbps: [10, 100],  duration_s: [120, 600],  compression_rho: 0.33, processing_logic: reliable_codec,                 cycles_per_bit_base: 200,  cycles_per_bit_per_dst: 0,  fixed_processing_ms: 0.10, fixed_processing_ms_per_dst: 0,    Lref_bits: 8000,    dst_knn: 10}
    HC: {priority: 3, mode: persist, delay_ms: 200, loss: 0.01,   rate_mbps: [100, 500], duration_s: [600, 1800], compression_rho: 0.20, processing_logic: heavy_content_codec,            cycles_per_bit_base: 1000, cycles_per_bit_per_dst: 0,  fixed_processing_ms: 1.00, fixed_processing_ms_per_dst: 0,    Lref_bits: 1000000}
    MC: {priority: 4, mode: persist, delay_ms: 200, loss: 0.01,   rate_kbps: [10, 100],  duration_s: [600, 1800], compression_rho: 0.05, processing_logic: multicast_aggregate_replicate, cycles_per_bit_base: 40,   cycles_per_bit_per_dst: 15, fixed_processing_ms: 0.10, fixed_processing_ms_per_dst: 0.02, Lref_bits: 12000,   k_dst: 3}

# ===================== 算法参数 =====================
algorithm:
  load_balance_k: 4              # 旧接口参数；S1的balance现采用分配后平方利用率增量
  reroute_all_each_slot: true     # 新快照中对所有尚未结束任务重新计算放置与路径
  enable_preemption: true
  preempt_lower_bound_ratio: 0.5
  enforce_energy_budget: true    # D4 能量硬约束
  top_m_candidates: 10           # S2/S3/S4 只精修前 M 个候选(按快速代价)
  refine_cap: 3                  # S2/S3 直连全失败时,最多对前几个候选做 KSP/LARAC 精修(限worst-case)
  ksp_K: 3                       # S2 Yen 的 K
  larac_max_iter: 20             # S3 迭代上限
  aco: {ants: 8, iters: 8, alpha: 1.0, beta: 2.0, evap: 0.3, q: 1.0}
  milp: {max_nodes: 80, max_tasks_per_slot: 15}   # S5 仅小规模

# ===================== 规模缩放(联调用) =====================
scale:
  enabled: true
  plane_cap: 6         # 缩比:每壳层最多 6 个平面(保持每面 20 颗→ISL 可见);--no-scale 时忽略
