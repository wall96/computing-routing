# ===================== 节点算力（应用层） =====================
compute_capacity_tflops:
  LEO:    372
  GEO:    1500
  EDGE:   30
  DC:     10000000     # 10^7
  ACCESS: 0

# ===================== 能耗模型 (§4) =====================
# 单节点每周期能耗 η_v = κ_v · f_v² (J/cycle)
energy_compute_eta_J_per_cycle:
  LEO:    1.0e-9
  GEO:    2.25e-9
  EDGE:   2.0e-9
  DC:     0.9e-9
  ACCESS: 0.0          # 占位

# 单链路每比特能耗 β_e = (P_tx + P_circ) / R (J/bit)
energy_link_beta_J_per_bit:
  TER:          1.5e-10
  ISL_LEO_LEO:  3.5e-9
  ISL_LEO_GEO:  4.0e-8
  SGL_LEO:      5.0e-8
  SGL_GEO:      1.2e-7

# ===================== 链路参数 =====================
link_params:
  isl_leo_leo:
    bw_mbps: 10000           # 10 Gbps
    loss_rate: 1.0e-6
    jitter_ms: 0.1
  isl_leo_geo:
    bw_mbps: 2000            # 2 Gbps
    loss_rate: 1.0e-5
    jitter_ms: 0.5
  sgl_leo:
    bw_mbps: 1000            # 1 Gbps
    loss_rate: 1.0e-4
    jitter_ms: 1.0
    min_elevation_deg: 25
  sgl_geo:
    bw_mbps: 1000
    loss_rate: 1.0e-4
    jitter_ms: 1.0
    min_elevation_deg: 5     # GEO 几乎在赤道上方，仰角阈低
  ter:
    bw_mbps: 100000          # 100 Gbps
    loss_rate: 1.0e-7
    jitter_ms: 0.05

# ===================== 业务参数 =====================
traffic:
  arrival_rate_per_slot:     # 每时间片新到达任务数（泊松）
    LL: 8                    # 低时延 突发
    HR: 5                    # 高可靠 突发
    HC: 3                    # 大容量 常驻
    MC: 2                    # 多连接 常驻
  qos:
    LL: {priority: 1, mode: burst,    delay_ms: 20,  loss: 0.01,    rate_mbps: [2, 10],   duration_s: [60, 300],   strategy: latency, cycles_per_bit: 300,  compression_rho: 0.20}
    HR: {priority: 2, mode: burst,    delay_ms: 200, loss: 2.0e-4,  rate_kbps: [10, 100], duration_s: [120, 600],  strategy: latency, cycles_per_bit: 500,  compression_rho: 1.00}
    HC: {priority: 3, mode: persist,  delay_ms: 200, loss: 0.01,    rate_mbps: [100, 500],duration_s: [600, 1800], strategy: balance, cycles_per_bit: 1000, compression_rho: 0.10}
    MC: {priority: 4, mode: persist,  delay_ms: 200, loss: 0.01,    rate_kbps: [10, 100], duration_s: [600, 1800], strategy: balance, cycles_per_bit: 500,  compression_rho: 0.15, k_dst: 3}

# ===================== 算法参数 =====================
algorithm:
  load_balance_k: 4
  preempt_lower_bound_ratio: 0.5     # 抢占时常驻任务最低保留比例
  enable_preemption: true
  compute_stages: 4                  # K：任务总 cycles 拆成 K 等份做在网计算 (§4.3)
  hr_skip_layered: true              # HR 业务 ρ=1 时短路到 flat Dijkstra,跳过分层图

# ===================== 规模缩放（联调用） =====================
# 把 leo.total 和 leo.planes 等比缩小可大幅加速；正式跑改回 1200/30
scale:
  leo_total_override: 240    # 6 平面 × 40 颗，开发时用
  leo_planes_override: 6
