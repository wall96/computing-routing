# 算力路由仿真配置（v3）
# 默认是"小规模快速跑通"配置；批量实验改 scale 字段即可。

simulation:
  scenario: A           # A: LEO+地面站  B: LEO+GEO
  t_start_sec: 0
  t_end_sec: 1800       # 30 min
  slot_sec: 30          # 时间片
  random_seed: 42
  log_level: INFO

# ===================== 拓扑 =====================
constellation:
  # Walker Star  T:P:F = total:planes:phase
  leo:
    total: 1200
    planes: 30
    phase: 1
    inclination_deg: 86.4
    altitude_km: 600
  geo:
    count: 3
    longitudes_deg: [0, 120, -120]   # 三星等间隔

